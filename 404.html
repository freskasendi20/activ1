<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="design-system.css">

  <script>
    // GitHub Pages Smart Route Resolver
    (function() {
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      const lastPart = parts.length > 0 ? parts[parts.length - 1].toLowerCase().replace(/\.html$/, '') : '';

      const routes = {
        'admin': 'dashboard.html',
        'dashboard': 'dashboard.html',
        'login': 'account.html',
        'register': 'account.html',
        'account': 'account.html',
        'privacy': 'privacy.html',
        'terms': 'terms.html',
        'refund': 'refund.html',
        'policy': 'policy.html',
        'about': 'about.html',
        'contact': 'contact.html',
        'reviews': 'reviews.html',
        'blog': 'blog.html',
        'category': 'category.html',
        'checkout': 'checkout.html',
        'track': 'track-order.html',
        'track-order': 'track-order.html',
        'index': './'
      };

      if (routes[lastPart]) {
        if (routes[lastPart] === './') {
          parts.pop();
          const target = parts.length > 0 ? '/' + parts.join('/') + '/' : '/';
          window.location.replace(target + window.location.search + window.location.hash);
        } else {
          parts[parts.length - 1] = routes[lastPart];
          const newPath = '/' + parts.join('/');
          window.location.replace(newPath + window.location.search + window.location.hash);
        }
      }
    })();
  </script>

  <style>
